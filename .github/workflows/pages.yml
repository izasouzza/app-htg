# Publica o app no GitHub Pages a cada push na main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deixa um deploy terminar antes de começar o próximo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # o Pages serve em https://izasouzza.github.io/app-htg/
          BASE_PATH: /app-htg/
        run: npm run build

      - name: Preparar para o Pages
        run: |
          # o Pages não roda Jekyll neste site
          touch dist/.nojekyll
          # SPA: rotas como /protocolo/42 caem no 404 do Pages, que devolve o app
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
